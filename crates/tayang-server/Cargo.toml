[package]
name = "tayang-server"
version = "0.0.4"
description = "Headless, self-hosted Tayang Studio web server"
edition = "2021"
publish = false

[[bin]]
name = "tayang-server"
path = "src/main.rs"

[dependencies]
tayang-core = { path = "../tayang-core" }
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "compression-gzip", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
mime_guess = "2"
http = "1"
http-body-util = "0.1"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
