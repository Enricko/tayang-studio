services:
  tayang:
    build:
      context: .
    image: tayang-studio-web:local
    env_file:
      - .env.web
    ports:
      # Bind to loopback and put a TLS reverse proxy in front. Change to "8787:8787" only for a
      # trusted LAN, never for the public internet without HTTPS.
      - "127.0.0.1:${TAYANG_HTTP_PORT:-8787}:8787"
    volumes:
      # Database, workspaces, generated media, Claude/opencode/codex config and agent credentials.
      - tayang-data:/data
    restart: unless-stopped
    depends_on:
      - tts
    # The image runs as UID/GID 10001. If you use a bind mount instead of the named volume, chown it:
    #   sudo chown -R 10001:10001 ./data
    security_opt:
      - no-new-privileges:true

  tts:
    build:
      context: .
      dockerfile: tts/Dockerfile
    image: tayang-studio-tts:local
    env_file:
      - .env.web
    environment:
      TAYANG_WORKSPACE_ROOT: /data/workspaces
      TAYANG_VOICES_DIR: /data/voices
      HF_HOME: /data/hf-cache
    volumes:
      - tayang-data:/data
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true

volumes:
  tayang-data:
